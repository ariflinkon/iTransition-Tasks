<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div id="quoteDisplay" class="text-center mb-4 p-4 border rounded shadow-sm bg-light">
        <p id="quote" class="lead">Click the button to generate a quote!</p>
        <button id="generateQuote" class="btn btn-primary">Generate Quote</button>
    </div>
    <div id="addQuote" class="text-center mt-4 p-4 border rounded shadow-sm bg-light">
        <input type="text" id="newQuote" class="form-control mb-2" placeholder="Enter a new quote">
        <button id="addQuoteButton" class="btn btn-success">Add Quote</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="random_quote_generator.js"></script>
</body>
</html>
